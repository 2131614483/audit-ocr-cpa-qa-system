{% extends "base.html" %}
{% set active = 'agents' %}
{% block title %}Agent 工坊 · 审计CPA综合系统{% endblock %}
{% block page_title %}🤖 Agent 工坊{% endblock %}

{% block content %}
<div class="toolbar">
  <span class="text-2">定义带角色与模型绑定的智能体，供团队协作调用</span>
  <span class="spacer"></span>
  <button class="btn btn-primary" onclick="openCreateModal()">＋ 新建 Agent</button>
</div>
<div id="agentGrid" class="grid-2" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
  <div class="empty-state" style="grid-column:1/-1">🤖 加载中…</div>
</div>
{% endblock %}

{% block scripts %}
<script>
let agents = [];

function loadAgents() {
  fetch('/api/agents/list').then(r => r.json()).then(data => {
    agents = data;
    const grid = document.getElementById('agentGrid');
    if (!agents.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div style="font-size:48px">🤖</div><div>还没有 Agent，点击右上角创建一个吧</div></div>';
      return;
    }
    grid.innerHTML = agents.map(a => {
      const builtinBadge = a.is_builtin ? '<span class="badge badge-low" style="margin-left:6px">内置</span>' : '';
      return `<div class="card" style="padding:18px;cursor:pointer;transition:box-shadow .15s" onclick="editAgent(${a.id})">
        <div style="font-size:30px">${a.icon || '🤖'}</div>
        <div style="font-size:16px;font-weight:600;margin-top:8px">${escapeHtml(a.display_name || a.name)}${builtinBadge}</div>
        <span class="badge badge-blue" style="margin-top:6px">${escapeHtml(a.role)}</span>
        <div class="text-2" style="font-size:13px;margin-top:8px;line-height:1.5">${escapeHtml(a.description || '')}</div>
        <div class="text-3" style="font-size:12px;margin-top:10px">模型: ${escapeHtml(a.model)} | 温度: ${a.temperature}</div>
        ${!a.is_builtin ? `<div style="margin-top:12px"><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteAgent(${a.id})">删除</button></div>` : ''}
      </div>`;
    }).join('');
  });
}

function agentFormHtml() {
  return `
    <div class="form-row">
      <div class="form-group"><label>名称</label><input class="form-control" id="f_name" placeholder="如：审核专家"></div>
      <div class="form-group"><label>角色标识</label><input class="form-control" id="f_role" placeholder="如：reviewer"></div>
    </div>
    <div class="form-group"><label>显示名称</label><input class="form-control" id="f_display_name" placeholder="如：审核专家-张三"></div>
    <div class="form-group"><label>描述</label><textarea class="form-control" id="f_description" placeholder="描述这个Agent的能力范围..."></textarea></div>
    <div class="form-group"><label>系统提示词</label><textarea class="form-control" id="f_prompt" rows="4" placeholder="你是一名专业的..."></textarea></div>
    <div class="form-row">
      <div class="form-group"><label>模型</label>
        <select class="form-select" id="f_model">
          <option value="deepseek-chat">DeepSeek Chat</option><option value="deepseek-reason">DeepSeek Reason</option>
        </select></div>
      <div class="form-group"><label>温度</label><input class="form-control" id="f_temperature" type="number" step="0.1" min="0" max="1" value="0.3"></div>
      <div class="form-group"><label>图标</label><input class="form-control" id="f_icon" value="🤖" maxlength="5"></div>
    </div>
    <div class="form-group"><label>技能</label>
      <div class="checkbox-row" id="f_skills">
        <label><input type="checkbox" value="knowledge_search" checked><span>📚 知识库检索</span></label>
        <label><input type="checkbox" value="qa_history_search" checked><span>📋 历史问答</span></label>
        <label><input type="checkbox" value="calculator"><span>🧮 计算器</span></label>
      </div>
    </div>`;
}

function openCreateModal() {
  openModal({ title: '新建 Agent', size: 'modal-lg', body: agentFormHtml(),
    foot: '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveAgent()">💾 保存</button>' });
  setFormEmpty();
  window._agentEditId = '';
}

function setFormEmpty() {
  ['f_name', 'f_role', 'f_display_name', 'f_description', 'f_prompt', 'f_icon'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  const icon = document.getElementById('f_icon'); if (icon) icon.value = '🤖';
  const temp = document.getElementById('f_temperature'); if (temp) temp.value = '0.3';
  const model = document.getElementById('f_model'); if (model) model.value = 'deepseek-chat';
  document.querySelectorAll('#f_skills input').forEach(cb => cb.checked = cb.value === 'knowledge_search' || cb.value === 'qa_history_search');
}

function editAgent(id) {
  const a = agents.find(x => x.id === id);
  if (!a) return;
  openCreateModal();
  window._agentEditId = a.id;
  const title = document.querySelector('.modal-box .modal-head span');
  if (title) title.textContent = '编辑 ' + (a.display_name || a.name);
  document.getElementById('f_name').value = a.name || '';
  document.getElementById('f_role').value = a.role || '';
  document.getElementById('f_display_name').value = a.display_name || '';
  document.getElementById('f_description').value = a.description || '';
  document.getElementById('f_prompt').value = a.prompt_template || '';
  document.getElementById('f_model').value = a.model || 'deepseek-chat';
  document.getElementById('f_temperature').value = a.temperature || 0.3;
  document.getElementById('f_icon').value = a.icon || '🤖';
  document.querySelectorAll('#f_skills input').forEach(cb => cb.checked = (a.skills || []).includes(cb.value));
}

function saveAgent() {
  const id = window._agentEditId || '';
  const data = {
    name: document.getElementById('f_name').value,
    role: document.getElementById('f_role').value,
    display_name: document.getElementById('f_display_name').value,
    description: document.getElementById('f_description').value,
    prompt_template: document.getElementById('f_prompt').value,
    model: document.getElementById('f_model').value,
    temperature: parseFloat(document.getElementById('f_temperature').value) || 0.3,
    icon: document.getElementById('f_icon').value || '🤖',
    skills: Array.from(document.querySelectorAll('#f_skills input:checked')).map(cb => cb.value)
  };
  if (!data.name || !data.role || !data.prompt_template) { showToast('请填写名称、角色标识和提示词', 'warning'); return; }
  const url = id ? '/api/agents/update' : '/api/agents/create';
  if (id) data.id = id;
  fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
    .then(r => r.json()).then(() => { closeModal(); loadAgents(); showToast('已保存', 'success'); });
}

function deleteAgent(id) {
  if (!confirm('确定删除该Agent？')) return;
  fetch('/api/agents/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) })
    .then(r => r.json()).then(() => { loadAgents(); showToast('已删除', 'success'); });
}

loadAgents();
</script>
{% endblock %}
